<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Plugin vs Skill vs MCP</title>
<style>
  /* Two faces only: one display, one UI. Point these at the brand's files in fonts/. */
  /* Two faces only: Kanit (display) + Sarabun (UI), Thai + Latin subsets of each (fontsource, OFL). */
  @font-face { font-family: Display; src: url(fonts/display-latin.woff2) format('woff2'); font-weight: 800; }
  @font-face { font-family: Display; src: url(fonts/display-thai.woff2) format('woff2'); font-weight: 800; unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
  @font-face { font-family: UI; src: url(fonts/ui-latin.woff2) format('woff2'); font-weight: 600; }
  @font-face { font-family: UI; src: url(fonts/ui-thai.woff2) format('woff2'); font-weight: 600; unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud">space: play/pause · ←/→: step · click: scrub · ?format=9x16 to preview other formats</div>
<script type="module" src="film.js"></script>
</body>
</html>
